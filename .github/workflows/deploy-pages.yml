name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
      BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Enforce repository script policy
        run: python scripts/check_repository_english.py --root .
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: |
          python -m pip install -e ".[test]"
          pnpm --dir web install --frozen-lockfile
      - name: Set reproducible build timestamp
        run: |
          BUILD_EPOCH="$(git show -s --format=%ct HEAD)"
          BUILD_TIMESTAMP="$(date -u -d "@$BUILD_EPOCH" +'%Y-%m-%dT%H:%M:%SZ')"
          printf 'BUILD_TIMESTAMP=%s\n' "$BUILD_TIMESTAMP" >> "$GITHUB_ENV"
      - name: Test and generate database
        run: |
          observatory-build --project-root . --timestamp "$BUILD_TIMESTAMP"
          python -m pytest -q
      - name: Test and build website
        run: |
          pnpm --dir web test
          pnpm --dir web build
      - name: Add downloadable database
        run: |
          mkdir -p web/dist/downloads
          cp generated/eu-ai-policy-observatory.sqlite web/dist/downloads/eu-ai-policy-observatory.sqlite
      - name: Check publication artefact
        run: python scripts/check_public_build.py --site web/dist --data generated/public-data.json --require-database
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
