name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
      BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Enforce repository script policy
        run: python scripts/check_repository_english.py --root .
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Python dependencies
        run: python -m pip install -e ".[test]"
      - name: Test and build database
        run: |
          observatory-build --project-root . --timestamp "1970-01-01T00:00:00Z"
          python -m pytest -q
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Test and build website
        working-directory: web
        run: |
          pnpm test
          pnpm build
          pnpm test:e2e
      - name: Check public output
        run: python scripts/check_public_build.py --site web/dist --data generated/public-data.json
      - name: Upload generated database build
        uses: actions/upload-artifact@v7
        with:
          name: database-build
          path: generated/
